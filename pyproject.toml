[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "yaobi-harness"
version = "0.0.1"
description = "Evidence-governed multi-agent clinical decision support harness for Yaobi"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Yaobi-Harness contributors" }]
keywords = ["TCM", "clinical decision support", "agents", "knowledge graph", "Yaobi"]
# PyYAML is required, not optional: skill manifests are policy files and must
# not be parsed by a hand-rolled parser. LLM providers need no extra packages —
# the adapters speak HTTP over the standard library.
dependencies = ["pyyaml>=6"]

[project.optional-dependencies]
xlsx = ["openpyxl>=3.1"]
langgraph = ["langgraph>=0.2"]
test = ["pytest>=8"]

[project.scripts]
yaobi-harness = "yaobi_harness.cli:main"

[tool.setuptools.packages.find]
include = ["yaobi_harness*"]
